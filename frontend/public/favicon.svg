<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#06b6d4" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#070a12"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#cineGrad)" fill-opacity="0.15" stroke="url(#cineGrad)" stroke-width="2"/>
  
  <!-- Central Badge with gradient -->
  <rect x="10" y="10" width="44" height="44" rx="12" fill="url(#cineGrad)" filter="url(#glow)"/>
  
  <!-- Film Slate / Frame Icon inside badge -->
  <rect x="18" y="20" width="28" height="24" rx="4" fill="#070a12" fill-opacity="0.88" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="18" y1="26.5" x2="46" y2="26.5" stroke="#ffffff" stroke-width="1.5"/>
  
  <!-- Film Sprocket holes -->
  <rect x="21" y="22.5" width="2.5" height="2.5" rx="0.5" fill="url(#cineGrad)"/>
  <rect x="27" y="22.5" width="2.5" height="2.5" rx="0.5" fill="url(#cineGrad)"/>
  <rect x="33" y="22.5" width="2.5" height="2.5" rx="0.5" fill="url(#cineGrad)"/>
  <rect x="39" y="22.5" width="2.5" height="2.5" rx="0.5" fill="url(#cineGrad)"/>
  
  <!-- Play triangle in center of frame -->
  <polygon points="29,31 29,39 37,35" fill="#ffffff"/>
  
  <!-- AI Sparkle in top right corner -->
  <path d="M47 6 C47 11 51 14 56 14 C51 14 47 17 47 22 C47 17 43 14 38 14 C43 14 47 11 47 6 Z" fill="url(#sparkleGrad)" filter="url(#glow)"/>
  <!-- Mini Sparkle bottom left -->
  <path d="M12 43 C12 46 14 48 17 48 C14 48 12 50 12 53 C12 50 10 48 7 48 C10 48 12 46 12 43 Z" fill="#38bdf8"/>
</svg>
